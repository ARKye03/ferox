[workspace]
resolver = "2"
members = [
    "ferox-core",
    "ferox-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FEROX Team"]
license = "MIT"

[workspace.dependencies]
# Core library (no external dependencies allowed)
ferox-core = { path = "ferox-core" }

# CLI dependencies
clap = { version = "4.5.54", features = ["derive"] }
